<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento riuscito - RedLustBet</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top,rgba(220,38,38,.28),transparent 35%),
        radial-gradient(circle at bottom,rgba(212,175,55,.18),transparent 35%),
        #050505;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      text-align:center;
    }

    .card{
      max-width:520px;
      background:rgba(255,255,255,.055);
      border:1px solid rgba(212,175,55,.28);
      border-radius:30px;
      padding:38px 26px;
      box-shadow:0 30px 80px rgba(0,0,0,.55);
    }

    img{
      width:110px;
      margin-bottom:20px;
    }

    h1{
      font-size:34px;
      margin-bottom:14px;
      background:linear-gradient(135deg,#ff1e1e,#ffd36a);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    p{
      color:#cfcfcf;
      line-height:1.6;
      margin-bottom:24px;
    }

    .btn{
      display:inline-block;
      padding:15px 24px;
      border-radius:999px;
      text-decoration:none;
      color:#fff;
      font-weight:800;
      background:linear-gradient(135deg,#e00000,#8b0000,#d4af37);
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="logo.png" alt="RedLustBet Logo">

    <h1>Pagamento completato</h1>

    <p>
      Accesso premium acquistato con successo.
      Ora torna alla dashboard per accedere alla VIP Room.
    </p>

    <a href="dashboard.html" class="btn">Vai alla dashboard</a>
  </div>

</body>
</html>
