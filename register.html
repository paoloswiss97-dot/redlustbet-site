<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati - RedLustBet</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#000,#300000);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:rgba(255,255,255,0.05);
            padding:30px;
            border-radius:15px;
            width:90%;
            max-width:400px;
            text-align:center;
            box-shadow:0 0 20px rgba(255,0,0,0.3);
        }

        h1{
            color:#ff0000;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#ff0000;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#cc0000;
        }

        a{
            color:gold;
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RedLustBet Register</h1>

    <input type="email" id="email" placeholder="Inserisci email">
    <input type="password" id="password" placeholder="Inserisci password">

    <button onclick="registerUser()">Registrati</button>

    <p style="margin-top:20px;">
        Hai già un account?
        <a href="login.html">Login</a>
    </p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getAuth,
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "TUA_API_KEY",
    authDomain: "TUO_AUTH_DOMAIN",
    projectId: "TUO_PROJECT_ID",
    storageBucket: "TUO_STORAGE_BUCKET",
    messagingSenderId: "TUO_MESSAGING_SENDER_ID",
    appId: "TUO_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.registerUser = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    createUserWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
        alert("Registrazione completata!");
        window.location.href = "pricing.html";
    })
    .catch((error) => {
        alert(error.message);
    });
}
</script>

</body>
</html>
