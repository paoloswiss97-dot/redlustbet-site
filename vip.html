<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedLustBet VIP</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:black;
            color:white;
            text-align:center;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            padding:20px;
            background:
            radial-gradient(circle at top, rgba(180,0,0,0.35), transparent 40%),
            radial-gradient(circle at bottom, rgba(255,180,0,0.12), transparent 40%),
            #000;
        }

        img{
            width:140px;
            margin-bottom:20px;
        }

        h1{
            font-size:50px;
            color:#ffce73;
            margin-bottom:20px;
        }

        p{
            max-width:700px;
            line-height:1.8;
            color:#ddd;
            margin-bottom:30px;
            font-size:18px;
        }

        .box{
            background:rgba(255,255,255,0.05);
            padding:40px;
            border-radius:20px;
            width:100%;
            max-width:800px;
        }

        .features{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin:30px 0;
        }

        .feature{
            background:rgba(255,255,255,0.05);
            padding:25px;
            border-radius:15px;
        }

        .feature h3{
            color:#ffce73;
            margin-bottom:10px;
        }

        .btn{
            display:inline-block;
            padding:15px 35px;
            margin:10px;
            border-radius:50px;
            text-decoration:none;
            font-weight:bold;
        }

        .stripe{
            background:red;
            color:white;
        }

        .home{
            background:#ffce73;
            color:black;
        }

        @media(max-width:768px){
            h1{
                font-size:35px;
            }

            p{
                font-size:16px;
            }
        }
    </style>
</head>
<body>

    <div class="box">

        <img src="logo.png" alt="RedLustBet Logo">

        <h1>RedLustBet VIP</h1>

        <p>
            Accesso esclusivo ai migliori pronostici,
            contenuti premium e community privata.
        </p>

        <div class="features">

            <div class="feature">
                <h3>VIP Predictions</h3>
                <p>Pronostici premium giornalieri.</p>
            </div>

            <div class="feature">
                <h3>Private Community</h3>
                <p>Accesso riservato ai membri premium.</p>
            </div>

            <div class="feature">
                <h3>Exclusive Content</h3>
                <p>Contenuti esclusivi disponibili solo qui.</p>
            </div>

        </div>

        <a href="https://buy.stripe.com/4gMbJ3eAFa9JayC4mV8AE00" class="btn stripe">
            Accedi Premium
        </a>

        <a href="/" class="btn home">
            Torna alla Home
        </a>

    </div>

</body>
</html>
