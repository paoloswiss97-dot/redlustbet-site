<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login - RedLustBet</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #000000, #2b0000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 22px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 30px rgba(180, 0, 0, 0.35);
    }

    h1 {
      color: #d4af37;
      margin-bottom: 10px;
      font-size: 30px;
    }

    p {
      color: #ccc;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 9px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #b40000, #d4af37);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      color: #ff6b6b;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>RedLustBet</h1>
    <p>Accedi alla tua area privata</p>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button onclick="login()">Accedi</button>

    <p style="margin-top:22px;">
      Non hai un account? <a href="register.html">Registrati</a>
    </p>

    <div id="message"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0M3w8_6CN5_azfQbVDO_dtoaJjbUrxjs",
      authDomain: "redlustbet.firebaseapp.com",
      projectId: "redlustbet",
      storageBucket: "redlustbet.firebasestorage.app",
      messagingSenderId: "1071361085496",
      appId: "1:1071361085496:web:9c6d7e7de49e372a35d6cd",
      measurementId: "G-4TK9NDTKHS"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = function () {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      if (!email || !password) {
        message.innerText = "Inserisci email e password.";
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          window.location.href = "vip.html";
        })
        .catch((error) => {
          console.error(error);

          if (error.code === "auth/invalid-email") {
            message.innerText = "Email non valida.";
          } else if (error.code === "auth/user-not-found") {
            message.innerText = "Account non trovato.";
          } else if (error.code === "auth/wrong-password") {
            message.innerText = "Password errata.";
          } else if (error.code === "auth/invalid-credential") {
            message.innerText = "Email o password non corretti.";
          } else {
            message.innerText = "Errore login: " + error.message;
          }
        });
    };
  </script>

</body>
</html>
